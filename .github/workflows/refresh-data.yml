name: Refresh news and fixtures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: sport-news-hourly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch hourly news and sports
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python -m backend.collector
      - name: Publish feed (conflict-safe)
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp docs/feed.json /tmp/worldpulse-feed.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/worldpulse-feed.json docs/feed.json
            git add docs/feed.json
            if git diff --cached --quiet; then
              echo "Feed unchanged"
              exit 0
            fi
            git commit -m 'data: refresh news and football [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Another update arrived; retrying publish"
          done
          exit 1
