name: WorldPulse
options:
  bundleIdPrefix: com.worldpulse
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 'نبض العالم'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.3.0'
targets:
  WorldPulse:
    type: application
    platform: iOS
    sources:
      - path: WorldPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worldpulse.daily
        PRODUCT_NAME: WorldPulse
schemes:
  WorldPulse:
    build:
      targets:
        WorldPulse: all
    run:
      config: Debug
    archive:
      config: Release
